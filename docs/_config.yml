theme: jekyll-theme-cayman
title: "Kenny's Horizon 每日精选新闻速递"
description: AI-curated daily digest of tech and research news
baseurl: "/Horizon" # the subpath of your site, e.g. /blog
url: "https://kennyneverland.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
