name: Mainline Matrix

# lianban settles the day's column after the 15:00 close and states ~16:10 for
# the screeners; the matrix page only says "收盘后定版". 18:10 Asia/Shanghai
# leaves roughly two hours of headroom and still sits ahead of the 09:02 daily
# run, which reads the previous close.
#
# 准点由 Cloudflare Worker 在 18:10 调 workflow_dispatch 发起；下面的 cron
# 排在 19:40，只在外部定时器没起来时替补，跑前先由 dispatch_guard.py 确认
# 今日 artifact 还没上传过。
on:
  schedule:
    - cron: '40 11 * * 1-5'
  workflow_dispatch:

jobs:
  # 兜底 cron 的去重闸。准点的主路径是 Cloudflare Worker 到点调
  # workflow_dispatch；下面那条 cron 只在外部定时器没起来时替补，所以触发后
  # 先问一句今天是不是已经有了。手动 dispatch 一律放行——回补和重跑不能被
  # 自己挡住。判定逻辑与测试在 scripts/dispatch_guard.py。
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      # 这一步只回答"该不该跑"，出任何意外都必须放行：闸坏了顶多多推一次，
      # 闸误判成"跳过"就是当天不出报。脚本还没上传时也走放行分支。
      - name: Decide whether the fallback cron should run
        id: chk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_WORKFLOW_FILE: mainline-matrix.yml
          GUARD_ARTIFACT: "mainline-matrix"
        run: |
          if [ -f scripts/dispatch_guard.py ]; then
            python3 scripts/dispatch_guard.py
          else
            echo "::warning::scripts/dispatch_guard.py 不存在，跳过去重闸，按放行处理"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  matrix:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script is standard-library only, so there is nothing to install.
      # pipefail makes a failed fetch fail the step even though output goes
      # through tee.
      - name: Read the matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mainline_matrix.py | tee mainline_matrix.txt
          python scripts/mainline_matrix.py --json > mainline_matrix.json

      # A schedule that fires before lianban republishes would silently record
      # yesterday's column as today's. Surface that as a warning instead. The
      # date alone is not enough — opendata carries the site's own state, and
      # only "final" means the close has been settled.
      - name: Check freshness
        shell: bash
        run: |
          LATEST=$(python -c "import json;print(json.load(open('mainline_matrix.json'))['dates'][0])")
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "matrix latest=$LATEST today=$TODAY"
          if [ "$LATEST" != "$TODAY" ]; then
            echo "::warning::lianban still shows $LATEST, not $TODAY — the page may not be republished yet"
          fi
          if curl -sf -A 'Mozilla/5.0' https://lianban.net/opendata/latest.json -o latest.json; then
            STATE=$(python -c "import json;d=json.load(open('latest.json'));k=d.get('kpi') or {};print(k.get('date'),d.get('status'))")
            echo "opendata $STATE"
            case "$STATE" in
              "$TODAY final") : ;;
              *) echo "::warning::opendata reports $STATE — the close is not settled yet" ;;
            esac
          else
            echo "::warning::opendata/latest.json unreachable; freshness unverified"
          fi
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 主线矩阵'
            echo ''
            if [ -s mainline_matrix.txt ]; then
              echo '```'
              cat mainline_matrix.txt
              echo '```'
            else
              echo '没有取到矩阵，详见上面的日志。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainline-matrix
          path: |
            mainline_matrix.txt
            mainline_matrix.json
          if-no-files-found: ignore
          retention-days: 30
