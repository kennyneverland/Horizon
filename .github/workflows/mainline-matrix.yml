name: Mainline Matrix

# lianban settles the day's column after the 15:00 close and states ~16:10 for
# the screeners; the matrix page only says "收盘后定版". 10:10 UTC is 18:10
# Asia/Shanghai — roughly two hours of headroom — and still ahead of the 08:00
# daily run, which reads the previous close.
on:
  schedule:
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script is standard-library only, so there is nothing to install.
      # pipefail makes a failed fetch fail the step even though output goes
      # through tee.
      - name: Read the matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mainline_matrix.py | tee mainline_matrix.txt
          python scripts/mainline_matrix.py --json > mainline_matrix.json

      # A schedule that fires before lianban republishes would silently record
      # yesterday's column as today's. Surface that as a warning instead. The
      # date alone is not enough — opendata carries the site's own state, and
      # only "final" means the close has been settled.
      - name: Check freshness
        shell: bash
        run: |
          LATEST=$(python -c "import json;print(json.load(open('mainline_matrix.json'))['dates'][0])")
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "matrix latest=$LATEST today=$TODAY"
          if [ "$LATEST" != "$TODAY" ]; then
            echo "::warning::lianban still shows $LATEST, not $TODAY — the page may not be republished yet"
          fi
          if curl -sf -A 'Mozilla/5.0' https://lianban.net/opendata/latest.json -o latest.json; then
            STATE=$(python -c "import json;d=json.load(open('latest.json'));k=d.get('kpi') or {};print(k.get('date'),d.get('status'))")
            echo "opendata $STATE"
            case "$STATE" in
              "$TODAY final") : ;;
              *) echo "::warning::opendata reports $STATE — the close is not settled yet" ;;
            esac
          else
            echo "::warning::opendata/latest.json unreachable; freshness unverified"
          fi
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 主线矩阵'
            echo ''
            if [ -s mainline_matrix.txt ]; then
              echo '```'
              cat mainline_matrix.txt
              echo '```'
            else
              echo '没有取到矩阵，详见上面的日志。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainline-matrix
          path: |
            mainline_matrix.txt
            mainline_matrix.json
          if-no-files-found: ignore
          retention-days: 30
