name: Post Market Brief

# This job fetches mainline.html itself; it does not read the matrix job's
# artifact, so the two can run in either order. 18:30 Asia/Shanghai. The data
# is on the site by then — the close is in, the limit-up list, the dragon-tiger
# board and the three screens are all up — and
# only the "final" stamp lags, to 21:30:0x (11-16 21:30:07, 11-18 21:30:06,
# 11-19 21:30:15, 11-20 21:30:14, 11-23 21:30:09). So the brief no longer waits
# for that stamp: post_market.py reads the third-party review straight off the
# day's own page and keeps it only when the text is there and its own dates and
# counts agree with today; otherwise that one section is dropped and the rest of
# the brief ships as usual. 18:30 + 8h never crosses a date boundary, so UTC 1-5
# is exactly Monday-Friday in Shanghai: no brief on Saturday or Sunday, which
# have no session to report on anyway.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '回补日期 YYYY-MM-DD（留空＝今天；只在该日 lianban 仍为 final 时有效）'
        required: false
        default: ''

# All three publishing jobs push the gh-pages branch, so they share one queue:
# a second run waits instead of overwriting the first one's output.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  # 兜底 cron 的去重闸。准点的主路径是 Cloudflare Worker 到点调
  # workflow_dispatch；下面那条 cron 只在外部定时器没起来时替补，所以触发后
  # 先问一句今天是不是已经有了。手动 dispatch 一律放行——回补和重跑不能被
  # 自己挡住。判定逻辑与测试在 scripts/dispatch_guard.py。
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      # 这一步只回答"该不该跑"，出任何意外都必须放行：闸坏了顶多多推一次，
      # 闸误判成"跳过"就是当天不出报。脚本还没上传时也走放行分支。
      - name: Decide whether the fallback cron should run
        id: chk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_WORKFLOW_FILE: post-market.yml
          GUARD_PRODUCT_URL: "https://kennyneverland.github.io/Horizon/post-market/{date}.html"
        run: |
          if [ -f scripts/dispatch_guard.py ]; then
            python3 scripts/dispatch_guard.py
          else
            echo "::warning::scripts/dispatch_guard.py 不存在，跳过去重闸，按放行处理"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  brief:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # The step below carries its own 18-minute ceiling; this one only has to be
    # large enough that the step is always the thing that gives up first. The
    # build starts at 18:30 and has nothing left to wait for, so the margin is
    # for runner queueing, not for the site.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The concept index ships in the repo but nothing ever wrote it back, so
      # every run began from the same cold cache and re-fetched the same hundred
      # odd tickers from the site. That is why run #22 had to give up on 82 of
      # 156: the list is rebuilt from zero every night. The cache carries what
      # --save-concepts wrote last time, so from the second night on the fetch
      # list holds only the tickers that are genuinely new. Keyed by run id,
      # restored by prefix: each run saves its own state and inherits the newest.
      - name: Restore the concept index
        uses: actions/cache@v4
        with:
          path: |
            data/stock_concepts.json.gz.b64
            data/stock_concepts.json.gz.b64.p2
            data/stock_concepts.json.gz.b64.p3
            data/stock_concepts.json.gz.b64.p4
          key: stock-concepts-${{ github.run_id }}
          restore-keys: |
            stock-concepts-

      # 主线强度 and 主力资金动向 have no JSON endpoint: the only way to read them
      # is to let the page's own script run. Everything else in the brief is
      # stdlib except the overseas tape, which needs httpx — Eastmoney drops
      # urllib's TLS fingerprint, so the fallback source has to come from a
      # client that gets through. A browser that fails to install costs those
      # two blocks only.
      - name: Install the browser
        run: |
          pip install --disable-pip-version-check playwright pydantic httpx
          python -m playwright install --with-deps chromium

      # This gate asks only whether the site has a page for TARGET. It must not
      # require "final": at 18:30 the site is still mid-session (status=active,
      # the review body possibly not written yet), and requiring the stamp is
      # exactly what kept the brief at 21:40. What it still catches is the
      # dangerous case: a day the pipeline slips would publish yesterday's
      # numbers under today's name and push them to WeChat. A weekend dispatch
      # fails it on its own — there is no Saturday or Sunday session.
      #
      # TARGET is what the page will be filed under: today by default, or the
      # date passed to a manual dispatch so a missed evening can be backfilled.
      - name: Check lianban has a page for the target close
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Shanghai date +%F)
          TARGET="${{ github.event.inputs.date }}"
          TARGET="${TARGET:-$TODAY}"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          curl -sf -A 'Mozilla/5.0' https://lianban.net/opendata/latest.json -o latest.json
          STATE=$(python -c "import json;d=json.load(open('latest.json'));k=d.get('kpi') or {};print(k.get('date'),d.get('status'))")
          echo "lianban date/status=$STATE target=$TARGET today=$TODAY"
          DATE_PART=${STATE%% *}
          if [ "$DATE_PART" = "$TARGET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::lianban's latest page is '$DATE_PART', not '$TARGET' — the brief is skipped"
          fi

      # continue-on-error: a failed WeChat push used to return 1 here, which
      # skipped the deploy step below and left the page unpublished (run 4,
      # 2026-11-19). The page is the deliverable; the push is a convenience.
      # 18 minutes is this step's own ceiling, not the job's. Run #21 sat inside
      # it for 21.5 minutes; the 25-minute job cap would have killed the run two
      # minutes later, deploy included, and nothing would have been published.
      # With the ceiling here the step dies alone, continue-on-error lets the
      # deploy below run, and a page that was already written still goes out.
      - name: Build the brief
        if: steps.fresh.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 18
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Without this, python block-buffers stdout under the runner's capture,
          # so every progress line (concepts, page, read, push) lands with one
          # exit timestamp. That is why run #21's log is 21 minutes of silence
          # instead of a record of where the time went.
          PYTHONUNBUFFERED: "1"
        # --save-concepts writes what this run fetched back into the index the
        # cache step above restored, so tomorrow's list is shorter by exactly
        # what today learned.
        run: |
          python scripts/post_market.py --out-dir docs/post-market --date "$TARGET" --save-concepts
        # continue-on-error above keeps a dead build from blocking the deploy of a
      # page that does exist — but it also reports green when no page was written
      # at all: run #9 showed every step success while the deploy was skipped for
      # want of an HTML file. Checking the exact file the deploy needs turns that
      # silent miss into a red run.
      - name: Check the brief was written
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          TARGET_FILE="docs/post-market/${TARGET}.html"
          if [ ! -s "$TARGET_FILE" ]; then
            echo "::error::no brief at $TARGET_FILE — the build failed silently"
            exit 1
          fi
          echo "brief written: $TARGET_FILE ($(wc -c < "$TARGET_FILE") B)"

      - name: Set the brief date
        if: steps.fresh.outputs.ok == 'true'
        run: echo "DATE=$TARGET" >> $GITHUB_ENV

      # Only deploy when the page actually exists: if the build died before
      # writing HTML, publishing an empty docs/ would be worse than a 404.
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.fresh.outputs.ok == 'true' && hashFiles('docs/post-market/*.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📊 Post-market brief: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # 连板网的「最新大盘信号」是站点不定期更新的结构判断，不是当日信号。每变一次
      # 落一个 data/signals/<日期>_<时刻>.json，旧的从不覆盖，`ls data/signals` 就是
      # 一份更新履历。放在部署之后：页面没出去就不记账，否则第二天会把一版没发过的
      # 内容当成已发而隐藏。continue-on-error——记账失败顶多下一期重出一次，不能
      # 因此把一次已经发出去的晚报判成失败。
      - name: Record the signal version
        if: steps.fresh.outputs.ok == 'true' && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/signals 2>/dev/null)" ]; then
            echo "signals: 内容没变，没有新版本要记"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # runner 是浅克隆，rebase 找不到共同祖先；直接把 HEAD 挪到远端最新提交。
            # 必须是 --mixed 不是 --soft：--soft 会连旧索引一起留下，别人在这期间推的
            # 改动会被我们的提交原样改回去（模拟里 config.github.json 就被回滚了）。
            # --mixed 让索引对齐远端，再只暂存 data/signals，其余改动一个不碰。
            git fetch -q --depth=1 origin main
            git reset -q --mixed FETCH_HEAD
            git add data/signals
            if git diff --cached --quiet; then
              echo "signals: 远端已包含这一版，无需再提交"
              exit 0
            fi
            git commit -q -m "chore(signals): 记录最新大盘信号 ${TARGET}"
            if git push -q origin HEAD:main; then
              echo "signals: 已提交 $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "signals: 第 ${attempt} 次推送被拒，重试" >&2
            sleep 3
          done
          echo "::warning::信号版本没能提交，下一期会重出一次"
          exit 0

      # 长图版：页面已经部署完再拍，拍到的就是这一期；文字版推送在 Python 里，
      # 这里只多发一条纯图消息。浏览器上一步已装好，不再重复下载。
      - name: Push long image
        if: steps.fresh.outputs.ok == 'true'
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ENDPOINT:-}" ] || [ -z "${HORIZON_WEBHOOK_URL:-}" ]; then
            echo "OSS 或 HORIZON_WEBHOOK_URL 未配置，跳过长图推送"
            exit 0
          fi
          python scripts/long_image.py \
            --url "https://kennyneverland.github.io/Horizon/post-market/${TARGET}.html" \
            --title "${TARGET} 晚报长图" \
            --marker "${TARGET}" \
            --key-prefix "horizon/evening/" \
            --banners data/webhook_banners.json

      # The build step tolerates a dead push so it cannot block the page, and
      # that tolerance also made every push failure invisible: page shipped,
      # WeChat silent, run green. post_market.py drops .push-failed on a failed
      # push; this step is what turns it into a red run — deliberately last, so
      # the page and the long image are already out by the time it fails.
      - name: Check the WeChat push landed
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -euo pipefail
          if [ -f .push-failed ]; then
            echo "::error::WeChat push failed — the page is published, nobody was notified"
            cat .push-failed
            exit 1
          fi
          echo "push: delivered"
