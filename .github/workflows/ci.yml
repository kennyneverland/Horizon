name: localized-tests

# 只跑本地化那几组：不碰网络、不调真实模型，红了就是代码真的坏了。
# 上游那 60 多个测试有网络依赖，先不进门，免得变成假红。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: localized-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localized:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run localized tests
        shell: bash
        run: |
          set -euo pipefail
          # 缺一个就红。误删测试不该让 CI 变绿——这正是 A1 在消灭的那类静默。
          required=(
            tests/test_summarizer.py
            tests/test_module_resolution.py
            tests/test_lianban_extra_constants.py
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::必需的本地化测试缺失：$f"
              exit 1
            fi
          done
          printf 'running: %s\n' "${required[*]}"
          python -m pytest "${required[@]}" -q --no-header
