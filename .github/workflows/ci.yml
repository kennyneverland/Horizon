name: localized-tests

# 本地化守卫：不碰网络、不调真实模型，红了就是代码真的坏了。
# test_summarizer 归类为「参考」：断言曾长期停在旧渲染格式（> 从 N 条筛选、**「背景」**、
# # Horizon Daily、Tags 写成粗体行），而实现早已变成折叠块与「」。
# 参考步骤不阻塞合并，但会把失败摘要与契约日期写进 run summary，不静默。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: localized-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localized:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Localized guards (blocking)
        shell: bash
        run: |
          set -euo pipefail
          # 缺一个就红。误删测试不该让 CI 变绿——这正是 A1 在消灭的那类静默。
          required=(
            tests/test_module_resolution.py
            tests/test_lianban_extra_constants.py
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::必需的本地化测试缺失：$f"
              exit 1
            fi
          done
          printf 'running: %s\n' "${required[*]}"
          python -m pytest "${required[@]}" -q --no-header

      - name: Upstream render tests (reference only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_summarizer.py -q --no-header --tb=no | tee /tmp/render.txt
          {
            echo '### 渲染测试（参考，不阻塞合并）'
            echo ''
            echo '契约最后更新 2026-08-01，此后三个半月无人运行；断言的格式已与当前实现脱节。'
            echo ''
            echo '```'
            tail -n 8 /tmp/render.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
