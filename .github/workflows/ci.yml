name: localized-tests

# 本地化守卫：不碰网络、不调真实模型，红了就是代码真的坏了。
# test_summarizer 已在 #16 跟随当前渲染、并恢复统计行引用块，16 条全绿，从「参考」升回 required。
# 四组任一缺失或失败即红：过期契约不许再被静默放过。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: localized-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localized:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Localized guards (blocking)
        shell: bash
        run: |
          set -euo pipefail
          # 缺一个就红。误删测试不该让 CI 变绿——这正是 A1 在消灭的那类静默。
          required=(
            tests/test_summarizer.py
            tests/test_module_resolution.py
            tests/test_lianban_extra_constants.py
            tests/test_post_market.py
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::必需的本地化测试缺失：$f"
              exit 1
            fi
          done
          printf 'running: %s\n' "${required[*]}"
          python -m pytest "${required[@]}" -q --no-header
