name: Daily Horizon Summary

on:
  schedule:
    # 兜底 cron，不是主路径。准点由 Cloudflare Worker 在 09:02 Asia/Shanghai
    # 调 workflow_dispatch 发起；这条排在 10:20，只在外部定时器没起来时替补，
    # 触发后先由 dispatch_guard.py 探一次当日页面，已经在线上就直接跳过。
    #
    # 为什么不能只靠它：GitHub 的 schedule 走低优先级队列，官方文档写明高负载
    # 期会延迟、负载足够高时排队中的任务还会被丢弃。本仓库 16 个样本 16/16
    # 延迟超过 15 分钟，早报稳定晚 48~93 分钟，另有 7 次约 24 小时。
    #
    # 起跑时刻决定内容：每个块等自己的时钟——早盘页 09:25、亚太 09:30 开盘、
    # 开盘块 09:40，三块都回来才拼装。起跑晚了这些时点已经过去，那就保留池子
    # 计数、丢掉实盘板块表，而不是把 10:35 的涨跌当成 09:40 印出去（见 opening.py）。
    - cron: '20 2 * * *'
  workflow_dispatch:      # 手动触发；外部定时器也走这条

# The daily run and the docs deploy both force-push to gh-pages, so they share
# one queue: a second run waits for the first instead of overwriting its output.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  # 兜底 cron 的去重闸。准点的主路径是 Cloudflare Worker 到点调
  # workflow_dispatch；下面那条 cron 只在外部定时器没起来时替补，所以触发后
  # 先问一句今天是不是已经有了。手动 dispatch 一律放行——回补和重跑不能被
  # 自己挡住。判定逻辑与测试在 scripts/dispatch_guard.py。
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      # 这一步只回答"该不该跑"，出任何意外都必须放行：闸坏了顶多多推一次，
      # 闸误判成"跳过"就是当天不出报。脚本还没上传时也走放行分支。
      - name: Decide whether the fallback cron should run
        id: chk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_WORKFLOW_FILE: daily-summary.yml
          GUARD_PRODUCT_URL: "https://kennyneverland.github.io/Horizon/{ymd}/summary-zh.html"
        run: |
          if [ -f scripts/dispatch_guard.py ]; then
            python3 scripts/dispatch_guard.py
          else
            echo "::warning::scripts/dispatch_guard.py 不存在，跳过去重闸，按放行处理"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  daily-summary:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # About 25 minutes of work plus up to 38 minutes waiting for the 09:40
    # opening block; this bounds one that hangs.
    timeout-minutes: 120
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      # 成员主营画像抓一次就复用；runner 每次都是全新的，只有 cache 能把它带过 run。
      - name: Restore member profile cache
        uses: actions/cache@v4
        with:
          path: data/member_profiles
          key: member-profiles-${{ github.run_id }}
          restore-keys: |
            member-profiles-
      # 开盘异动的昨日对比读这份存档：每次跑完把当日快照写回 data/opening，
      # 下一次读最新的那份。runner 每次都是全新的，只有 cache 能把它带过 run。
      - name: Restore opening snapshots
        uses: actions/cache@v4
        with:
          path: data/opening
          key: opening-${{ github.run_id }}
          restore-keys: |
            opening-
      # 日历三星每天只保留「今天及以后」，次日再抓前一天已经翻篇，所以当天落盘、
      # 次日读档。和开盘快照一样，runner 每次都是全新的，只有 cache 能带过 run。
      - name: Restore calendar archive
        uses: actions/cache@v4
        with:
          path: data/calendar
          key: calendar-${{ github.run_id }}
          restore-keys: |
            calendar-

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        # shell: bash enables pipefail, so a failed run still fails the step
        # even though the output goes through tee.
        shell: bash
        run: uv run horizon --hours 24 2>&1 | tee run.log
        # The job log is only readable with admin rights on the repository, so a
      # run that dies (timeout included) leaves nothing to review afterwards.
      # The artifact keeps the same output reachable from the Actions API.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-run-log
          path: run.log
          if-no-files-found: ignore
          retention-days: 14

      # 日历、开盘快照、主线基线原先只活在 Actions 缓存里，三处都会静默出错：
      # 缓存 7 天不用就清，长假后第一个交易日既找不到「昨日同刻」的开盘读数，
      # 也读不到昨日日历事件；mainline_snapshot 更是每天重写却从不提交，仓库里
      # 那份停在 2026-11-18，连板网不可达时兜底读的是八天前的基线，日志不报警。
      # 三者合计约 3.5 KB/天，先全量提交，暂不做滚动清理。
      - name: Commit daily archives
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          paths=""
          for p in data/calendar data/opening data/mainline_snapshot.json; do
            if [ -e "$p" ]; then paths="$paths $p"; fi
          done
          if [ -z "$paths" ]; then
            echo "archives: 三个路径都不存在，跳过"
            exit 0
          fi
          if [ -z "$(git status --porcelain $paths 2>/dev/null)" ]; then
            echo "archives: 今天没有新的日历/开盘/主线快照"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # runner 是浅克隆，rebase 找不到共同祖先；--mixed 让索引对齐远端，
            # 再只暂存这三个路径，别人在这期间推的改动一个不碰。
            git fetch -q --depth=1 origin main
            git reset -q --mixed FETCH_HEAD
            git add $paths
            if git diff --cached --quiet; then
              echo "archives: 远端已包含今天这几份，无需再提交"
              exit 0
            fi
            git commit -q -m "chore(archives): 落盘 $(TZ=Asia/Shanghai date +%F) 日历/开盘快照与主线基线"
            if git push -q origin HEAD:main; then
              echo "archives: 已提交 $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "archives: 第 ${attempt} 次推送被拒，重试" >&2
            sleep 3
          done
          echo "::warning::日历/开盘/主线快照没能提交，下一天会再试"
          exit 0

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 早报页面是 Jekyll 从 docs/_posts/*.md 渲染出来的，runner 里没有渲染后的
      # HTML，长图脚本那道"远端 HTML 必须与本地逐字节一致"的闸对早报一直失效，
      # 只能退回 marker；而 marker 是当天日期，早上那一版同样含这串，Pages 的
      # CDN 缓存没过期时就会立刻放行、拍到上一版（2026-11-23 下午那次就是这样：
      # 部署 08:16:10 完成，08:23:46 就"就绪"，拍到的仍是早上那版）。
      # 给这一期的 front matter 打一个只属于本次运行的 build 标记，长图用它当
      # marker：旧页面不含这串，等不到就不拍，宁可这一步红，也不推旧图。
      - name: Stamp summary build marker
        run: |
          set -euo pipefail
          BUILD="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          python3 - "$BUILD" <<'PY'
          import pathlib, sys
          build = sys.argv[1]
          stamped = 0
          for path in sorted(pathlib.Path("docs/_posts").glob("*-summary-zh.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  continue
              head = text.split("\n---", 1)[0]
              if "build:" in head:
                  continue
              path.write_text("---\n" + f"build: {build}\n" + text[4:], encoding="utf-8")
              stamped += 1
          print(f"build marker {build} stamped on {stamped} summary file(s)")
          if stamped == 0:
              raise SystemExit("no summary markdown found under docs/_posts")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # 长图版：必须在部署之后拍，拍的是已经上线的那一版；文字版推送在 Python 里，
      # 这一步只多发一条纯图消息，两条都落在微信里，可分别转发。
      - name: Push long image
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ENDPOINT:-}" ] || [ -z "${HORIZON_WEBHOOK_URL:-}" ]; then
            echo "OSS 或 HORIZON_WEBHOOK_URL 未配置，跳过长图推送"
            exit 0
          fi
          pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
          Y=$(date +%Y); M=$(date +%m); D=$(date +%d)
          # 通知标题里的星期跟着当天走：1=周一 … 7=周日。
          case $(date +%u) in
            1) WD=周一;; 2) WD=周二;; 3) WD=周三;; 4) WD=周四;;
            5) WD=周五;; 6) WD=周六;; *) WD=周日;;
          esac
          python scripts/long_image.py \
            --url "https://kennyneverland.github.io/Horizon/${Y}/${M}/${D}/summary-zh.html" \
            --title "Kenny's Horizon ${WD}新闻早报长图-${M#0}月${D#0}日" \
            --marker "name=\"horizon-build\" content=\"${BUILD}\"" \
            --wait 780 \
            --key-prefix "horizon/morning/" \
            --banners data/webhook_banners.json
