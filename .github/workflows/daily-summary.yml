name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 00:00 UTC is 08:00 Asia/Shanghai.
    - cron: '0 0 * * *'
  workflow_dispatch:      # Allow manual trigger

# The daily run and the docs deploy both force-push to gh-pages, so they share
# one queue: a second run waits for the first instead of overwriting its output.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-24.04
    # A normal run takes about 25 minutes; this bounds one that hangs.
    timeout-minutes: 75
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      # 成员主营画像抓一次就复用；runner 每次都是全新的，只有 cache 能把它带过 run。
      - name: Restore member profile cache
        uses: actions/cache@v4
        with:
          path: data/member_profiles
          key: member-profiles-${{ github.run_id }}
          restore-keys: |
            member-profiles-
      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        # shell: bash enables pipefail, so a failed run still fails the step
        # even though the output goes through tee.
        shell: bash
        run: uv run horizon --hours 24 2>&1 | tee run.log
        # The job log is only readable with admin rights on the repository, so a
      # run that dies (timeout included) leaves nothing to review afterwards.
      # The artifact keeps the same output reachable from the Actions API.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-run-log
          path: run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # 长图版：必须在部署之后拍，拍的是已经上线的那一版；文字版推送在 Python 里，
      # 这一步只多发一条纯图消息，两条都落在微信里，可分别转发。
      - name: Push long image
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ENDPOINT:-}" ] || [ -z "${SENDKEY:-}" ]; then
            echo "OSS 或 SENDKEY 未配置，跳过长图推送"
            exit 0
          fi
          pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium
          Y=$(date +%Y); M=$(date +%m); D=$(date +%d)
          python scripts/long_image.py \
            --url "https://kennyneverland.github.io/Horizon/${Y}/${M}/${D}/summary-zh.html" \
            --title "${M#0}月${D#0}日 早报长图" \
            --marker "${Y}-${M}-${D}" \
            --key-prefix "horizon/morning/"
